# Compilează aplicația pe un Mac din GitHub (gratuit), fără Mac local:
#  1. build pentru iOS Simulator (verifică că proiectul compilează)
#  2. build pentru iPhone, nesemnat, împachetat ca EnduroFleet.ipa
#     -> se instalează pe telefon de pe Windows cu Sideloadly (semnează cu Apple ID-ul tău)
name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # ca să poată publica .ipa-ul în GitHub Releases

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project EnduroFleet.xcodeproj \
            -scheme EnduroFleet \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild build \
            -project EnduroFleet.xcodeproj \
            -scheme EnduroFleet \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package EnduroFleet.ipa
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/EnduroFleet.app Payload/
          zip -qry EnduroFleet.ipa Payload
          ls -lh EnduroFleet.ipa

      - name: Upload .ipa as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnduroFleet-ipa
          path: ${{ runner.temp }}/EnduroFleet.ipa

      - name: Publish .ipa to the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$RUNNER_TEMP/EnduroFleet.ipa" \
            --target "$GITHUB_SHA" \
            --title "EnduroFleet (latest build)" \
            --notes "Unsigned build of $GITHUB_SHA. Install on iPhone with Sideloadly (see INSTALL-IPHONE.md)."
