# Opțional: pe un Mac cu xcodegen (brew install xcodegen) rulezi `xcodegen` ca să regenerezi
# EnduroFleet.xcodeproj. Proiectul generat este deja în repo, deci nu e obligatoriu.
name: EnduroFleet
options:
  bundleIdPrefix: com.hambasanvlad
  deploymentTarget:
    iOS: "16.0"
targets:
  EnduroFleet:
    type: application
    platform: iOS
    sources: [EnduroFleet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hambasanvlad.EnduroFleet
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Enduro Fleet
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
